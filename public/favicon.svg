<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="favPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#favGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="64" cy="64" r="48" stroke="url(#favPurple)" stroke-width="2" stroke-dasharray="10 5" fill="none" opacity="0.7"/>
  <circle cx="64" cy="64" r="38" stroke="url(#favCyan)" stroke-width="2.5" stroke-dasharray="18 6 6 6" fill="none" filter="url(#favGlow)"/>
  <polygon points="64,36 84,72 44,72" stroke="#fbbf24" stroke-width="2" fill="none" filter="url(#favGlow)"/>
  <circle cx="64" cy="64" r="10" fill="#38bdf8" filter="url(#favGlow)"/>
  <circle cx="64" cy="64" r="4" fill="#ffffff"/>
</svg>
