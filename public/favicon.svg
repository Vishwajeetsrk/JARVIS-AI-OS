<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="jarvisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="jarvisCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="jarvisGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="arcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="128" height="128" rx="28" fill="url(#jarvisBg)" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Outer Reactor Arc Segments -->
  <circle cx="64" cy="64" r="50" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 6 16 6" fill="none" opacity="0.4"/>
  <circle cx="64" cy="64" r="42" stroke="url(#jarvisCyan)" stroke-width="3" stroke-dasharray="24 8 12 8" fill="none" filter="url(#arcGlow)"/>

  <!-- Inner High-Power Nodes -->
  <circle cx="64" cy="64" r="28" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.8"/>
  
  <!-- Central Triangular Power Matrix -->
  <polygon points="64,34 88,74 40,74" stroke="url(#jarvisGold)" stroke-width="3" fill="#0f172a" fill-opacity="0.6" filter="url(#arcGlow)"/>
  <polygon points="64,42 80,70 48,70" stroke="#fef08a" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- Core Radiant Fusion Eye -->
  <circle cx="64" cy="60" r="10" fill="url(#jarvisCyan)" filter="url(#arcGlow)"/>
  <circle cx="64" cy="60" r="5" fill="#ffffff"/>
  <circle cx="64" cy="60" r="2" fill="#020617"/>
</svg>
