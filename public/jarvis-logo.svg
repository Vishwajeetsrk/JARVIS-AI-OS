<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Emblem -->
  <g transform="translate(30, 30)">
    <circle cx="0" cy="0" r="22" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="16" stroke="url(#logoCyan)" stroke-width="2" stroke-dasharray="10 3" fill="none" filter="url(#logoGlow)"/>
    <polygon points="0,-10 9,6 -9,6" stroke="url(#logoGold)" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
  </g>
  <!-- Text -->
  <text x="64" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="3">
    JARVIS <tspan fill="url(#logoCyan)">AI OS</tspan>
  </text>
</svg>
