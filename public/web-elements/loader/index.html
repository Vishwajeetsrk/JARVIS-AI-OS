<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Preloader</title>
	<style>


		.h1{
			margin: 0;
			color: #fff;
			padding-bottom: 500px;
		}

		body
		{
			margin: 0;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: black;
		}

		.loader
		{
			width: 10em;
			border: 0.3em solid silver;
			height: 3em;
			border-radius: 3em;
			font-size: 20px;
			border-left-color: lime;
			border-right-color: #fb6542;
			position: relative;
			animation: spin 3s linear infinite;
		}

		@keyframes spin
		{
			to
			{
				transform: rotate(360deg);
			}
		}

		.loader::before
		{
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 3em;
			height: 3em;
			background: #fb6542;
			border-radius: 50%;
			animation: shift 3s linear infinite, change-color 3s linear infinite;
		}

		@keyframes shift
		{
			50%
			{
				left: 7em;
			}
		}

		@keyframes change-color
		{
			0%, 50%{
				background-color: #fb6542;
			}

			5%,50%{
				background-color: lime;
			}
		}

	</style>
</head>
<body>

	<div class="loader"></div>

	<div class="h1"><h1>Loader</h1></div>

</body>
</html>
