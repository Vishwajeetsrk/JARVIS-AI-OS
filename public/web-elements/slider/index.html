<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Image slider</title>

	<style type="text/css">
		body
		{
			font-family: tahoma;
			overflow-x: hidden;
			background: gray;
		}

		.h1-slide
		{
			position: relative;
			width: 754px;
			height: 292px;
			margin: 115px auto 0;
		}

		.hi-slide .hi-next,
		.hi-slide .hi-prev
		{
			position: absolute;
			top: 50%;
			width: 40px;
			margin-top: -20px;
			border-radius: 50px;
			line-height: 40px;
			text-align: center;
			cursor: pointer;
			background-color: white;
			color: black;
		}
	</style>
</head>
<body>

	<div class="slide h1-slide">
		<div class="hi-prev"></div>
		<div class="hi-next"></div>
		<ul>
			<li>
				<img src="image1.jpg">
			</li>

			<li>
				<img src="image2.jpg">
			</li>

			<li>
				<img src="image3.jpg">
			</li>

			<li>
				<img src="image4.jpg">
			</li>

			<li>
				<img src="image5.jpg">
			</li>

			<li>
				<img src="image6.jpg">
			</li>

			<li>
				<img src="image2.jpg">
			</li>
		</ul>
	</div>


</body>
</html>
