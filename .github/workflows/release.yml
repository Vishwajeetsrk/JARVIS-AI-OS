name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
          - os: macos-latest
            platform: macos-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.platform }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI package
        run: |
          mkdir -p dist-cli
          cp -r cli/ dist-cli/
          cp package.json dist-cli/
          cp README.md dist-cli/
          cp LICENSE dist-cli/
          cat > dist-cli/package.json << EOF
          {
            "name": "@vishwajeet/jarvis",
            "version": "${{ github.ref_name || '2.4.0' }}",
            "description": "Jarvis AI OS — CLI",
            "bin": { "jarvis": "./index.ts" },
            "type": "module",
            "dependencies": {
              "commander": "^15.0.0"
            }
          }
          EOF

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-cli
          path: dist-cli/

  release:
    needs: [build-desktop, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/jarvis-macos/**/*.dmg
            artifacts/jarvis-macos-intel/**/*.dmg
            artifacts/jarvis-linux/**/*.AppImage
            artifacts/jarvis-linux/**/*.deb
            artifacts/jarvis-linux/**/*.rpm
            artifacts/jarvis-windows/**/*.exe
            artifacts/jarvis-windows/**/*.msi
            artifacts/jarvis-cli/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
