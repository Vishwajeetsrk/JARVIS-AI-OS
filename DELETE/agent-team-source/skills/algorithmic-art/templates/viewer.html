<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Art Viewer — Algorithmic Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .control-section { margin-bottom: 24px; }
        .control-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

        .seed-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
            margin-bottom: 8px;
        }

        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .button:hover { background: #c86641; }
        .button.secondary { background: var(--anthropic-blue); }
        .button.tertiary { background: var(--anthropic-green); }

        .control-group { margin-bottom: 16px; }
        .control-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        .slider-container { display: flex; align-items: center; gap: 10px; }
        .slider-container input[type="range"] { flex: 1; accent-color: var(--anthropic-orange); }
        .value-display { font-family: monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 50px; text-align: right; }

        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; }
        #canvas-container { width: 100%; max-width: 900px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Organic Turbulence</h1>
            <div class="subtitle">p5.js Generative Aesthetic Viewer</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random Seed</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="1000" max="8000" step="500" value="4000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">4000</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Flow Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.1" max="2.0" step="0.1" value="0.6" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">0.6</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.02" step="0.001" value="0.005" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.005</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <button class="button" onclick="exportPNG()">Export PNG</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container"></div>
        </div>
    </div>

    <script>
        let params = { seed: 12345, particleCount: 4000, flowSpeed: 0.6, noiseScale: 0.005 };

        function setup() {
            let canvas = createCanvas(900, 900);
            canvas.parent('canvas-container');
            initializeArt();
        }

        function initializeArt() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            background(250, 249, 245);
        }

        function draw() {
            stroke(217, 119, 87, 25);
            strokeWeight(1);
            for (let i = 0; i < params.particleCount / 50; i++) {
                let x = random(width);
                let y = random(height);
                let angle = noise(x * params.noiseScale, y * params.noiseScale) * TWO_PI * 4;
                line(x, y, x + cos(angle) * 15 * params.flowSpeed, y + sin(angle) * 15 * params.flowSpeed);
            }
        }

        function updateSeed() {
            params.seed = parseInt(document.getElementById('seed-input').value) || 12345;
            initializeArt();
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); document.getElementById('seed-input').value = params.seed; initializeArt(); }
        function nextSeed() { params.seed += 1; document.getElementById('seed-input').value = params.seed; initializeArt(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; document.getElementById('seed-input').value = params.seed; initializeArt(); }
        function updateParam(name, val) { params[name] = parseFloat(val); document.getElementById(name + '-value').textContent = val; initializeArt(); }
        function exportPNG() { saveCanvas('algorithmic-art-' + params.seed, 'png'); }
    </script>
</body>
</html>
