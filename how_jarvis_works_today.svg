  <text x="965" y="49" fill="#10b981" font-size="11" font-family="'JetBrains Mono', monospace">SYSTEM: OK</text>
  
  <rect x="1060" y="33" width="100" height="24" rx="12" fill="rgba(6,182,212,0.1)" stroke="#06b6d4" stroke-width="1"/>
