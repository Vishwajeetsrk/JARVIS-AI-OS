  <circle cx="65" cy="45" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="6" fill="#10b981"/>
  <text x="110" y="50" fill="#e6edf3" font-size="14" font-weight="600" font-family="'JetBrains Mono', monospace">JARVIS COMMAND CONSOLE v2.2</text>
  
  <rect x="940" y="33" width="110" height="24" rx="12" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1"/>
