  <rect x="40" y="430" width="1120" height="120" rx="8" fill="#161b22" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <rect x="55" y="445" width="115" height="22" rx="4" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1"/>
  <text x="65" y="460" fill="#22d3ee" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">saas-builder</text>
  <text x="180" y="460" fill="#8b949e" font-size="11" font-family="'JetBrains Mono', monospace">14:15:08 PST</text>
  <text x="55" y="490" fill="#e6edf3" font-size="14">PRD &amp; TRD updated. Created webhook schema in src/mastra/tools/agencyos-billing-webhook.ts with Zod payload validation.</text>
  <text x="55" y="515" fill="#8b949e" font-size="13" font-family="'JetBrains Mono', monospace">> Handing off to test-agent for independent security review...</text>
  <rect x="550" y="504" width="8" height="14" fill="#06b6d4"/>

  <!-- Footer Input Composer Bar (Dual Text + Voice) -->
  <rect x="20" y="700" width="1160" height="75" rx="10" fill="#131924" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Voice Mic Toggle (Active Listening Waveform State) -->
  <rect x="35" y="715" width="45" height="45" rx="8" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- SVG Mic Icon -->
  <rect x="52" y="725" width="10" height="16" rx="5" fill="#06b6d4"/>
  <path d="M47 735 A 15 15 0 0 0 67 735" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="57" y1="750" x2="57" y2="754" stroke="#06b6d4" stroke-width="2"/>

  <!-- Live Voice Listening Waveform Micro-animation -->
  <rect x="90" y="728" width="60" height="20" rx="4" fill="rgba(6,182,212,0.1)"/>
  <line x1="98" y1="738" x2="98" y2="742" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="733" x2="104" y2="747" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="730" x2="110" y2="750" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="116" y1="735" x2="116" y2="745" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="122" y1="737" x2="122" y2="743" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <text x="158" y="742" fill="#06b6d4" font-size="11" font-family="'JetBrains Mono', monospace">LISTENING (REAL-TIME TRANSCRIPT filling composer below)</text>

  <!-- Primary Editable Text Composer Input Box -->
  <text x="90" y="760" fill="#e6edf3" font-size="14">Run independent security check on agencyos-billing-webhook.ts before deploy preparation...</text>

  <!-- SVG Send Button -->
  <rect x="1115" y="715" width="45" height="45" rx="8" fill="url(#cyanGlow)"/>
  <path d="M1130 738 L1145 730 L1138 745 L1134 739 Z" fill="#090c10"/>
