  <!-- Step 1: CEO (Active) -->
  <rect x="160" y="117" width="110" height="22" rx="4" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="172" y="132" fill="#a78bfa" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">✓ ceo-agent</text>

  <!-- Connector -->
  <line x1="275" y1="128" x2="295" y2="128" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Step 2: Team (Active) -->
  <rect x="300" y="117" width="115" height="22" rx="4" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="312" y="132" fill="#60a5fa" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">✓ team-agent</text>

  <!-- Connector -->
  <line x1="420" y1="128" x2="440" y2="128" stroke="#3b82f6" stroke-width="2"/>

  <!-- Step 3: SaaS Builder (In Progress) -->
  <rect x="445" y="117" width="130" height="22" rx="4" fill="rgba(6,182,212,0.25)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="457" y="132" fill="#22d3ee" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">▶ saas-builder</text>

